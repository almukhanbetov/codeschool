services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeschool}
      POSTGRES_USER: ${POSTGRES_USER:-codeschool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeschool}
    ports:
      # Host port 5433 (not 5432) so this doesn't collide with a Postgres
      # already running on the host. Only relevant if you connect from the
      # host itself (psql, goose run locally); containers always talk to
      # each other over the internal network on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeschool} -d ${POSTGRES_DB:-codeschool}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    entrypoint: ["goose", "-dir", "migrations", "postgres"]
    command: ["${DATABASE_URL:-postgres://codeschool:codeschool@postgres:5432/codeschool?sslmode=disable}", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  # Sandboxed code-execution service. It runs untrusted student code, so it is
  # kept off the internet (internal-only network), non-root, with every Linux
  # capability dropped, a read-only rootfs (scratch on tmpfs), and hard
  # pid / memory / cpu caps. It is NOT published on a host port — only the
  # backend reaches it over the internal network. The runner binary adds the
  # per-execution guards (wall-clock timeout, ulimits, output caps).
  runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.runner
    restart: unless-stopped
    environment:
      PORT: 8090
    networks:
      - sandbox
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # /work holds the compiled binary for `go run`, so it must allow exec.
      - /work:exec,size=512m,mode=1777
      - /gocache:size=256m,mode=0777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.5"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://codeschool:codeschool@postgres:5432/codeschool?sslmode=disable}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      RUNNER_URL: ${RUNNER_URL:-http://runner:8090}
    ports:
      - "8080:8080"
    networks:
      - default
      - sandbox
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # Server-side API calls (Server Components) run *inside* the frontend
        # container — this must resolve on the Docker network (the "backend"
        # service name), not "localhost" (which inside a container means the
        # container itself). "localhost:8080" is only correct for a non-Docker
        # `npm run dev`/`npm run build` on the host — see frontend/.env.example.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8080/api/v1}
        # Auth calls run in the browser (so the HttpOnly refresh cookie works),
        # so this URL must be reachable from the user's machine.
        NEXT_PUBLIC_BROWSER_API_URL: ${NEXT_PUBLIC_BROWSER_API_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

networks:
  default: {}
  # No internet egress: student code in the runner cannot phone home.
  sandbox:
    internal: true

volumes:
  postgres_data:
